name: Browser E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repliyo_test
          POSTGRES_PASSWORD: repliyo_test
          POSTGRES_DB: repliyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repliyo_test -d repliyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://repliyo_test:repliyo_test@127.0.0.1:5432/repliyo_test
      DATABASE_URL: postgresql://repliyo_test:repliyo_test@127.0.0.1:5432/repliyo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run HTTP integration tests
        run: npm run test:integration

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <title>%LANDING_TITLE%</title>
    <meta name="description" content="%LANDING_DESCRIPTION%" />
    
    <link rel="canonical" href="%LANDING_CANONICAL_URL%" />
    <link rel="alternate" hreflang="en" href="%LANDING_CANONICAL_URL%" />
    <link rel="alternate" hreflang="es" href="%LANDING_ES_CANONICAL_URL%" />
    <link rel="alternate" hreflang="x-default" href="%LANDING_CANONICAL_URL%" />

    <meta property="og:title" content="%LANDING_TITLE%" />
    <meta property="og:description" content="%LANDING_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%LANDING_CANONICAL_URL%" />
    <meta property="og:locale" content="%LANDING_OG_LOCALE%" />
    <meta property="og:locale:alternate" content="%LANDING_OG_LOCALE_ALTERNATE%" />
    <meta property="og:image" content="https://repliyo.com/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="576" />
    <meta property="og:image:alt" content="%LANDING_IMAGE_ALT%" />
    <meta property="og:site_name" content="Repliyo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@repliyo" />
    <meta name="twitter:title" content="%LANDING_TITLE%" />
    <meta name="twitter:description" content="%LANDING_DESCRIPTION%" />
    <meta name="twitter:image" content="https://repliyo.com/og-image.png" />

    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" href="/src/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      if (window.location.pathname !== "/") {
        const preconnectApi = document.createElement("link");
        preconnectApi.rel = "preconnect";
        preconnectApi.href = "https://fonts.googleapis.com";
        document.head.appendChild(preconnectApi);

        const preconnectFonts = document.createElement("link");
        preconnectFonts.rel = "preconnect";
        preconnectFonts.href = "https://fonts.gstatic.com";
        preconnectFonts.crossOrigin = "anonymous";
        document.head.appendChild(preconnectFonts);

        const appFonts = document.createElement("link");
        appFonts.rel = "stylesheet";
        appFonts.href = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap";
        document.head.appendChild(appFonts);
      }
    </script>
    <style>
      .initial-app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(circle at 50% 45%, rgba(2, 145, 250, 0.09), transparent 34%),
          #ffffff;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }

      .initial-app-loader__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .initial-app-loader__mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, #0291fa, #06b6d4);
        box-shadow: 0 12px 32px rgba(2, 145, 250, 0.24);
        color: #ffffff;
        font-size: 21px;
        font-weight: 800;
      }

      .initial-app-loader__bar {
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(2, 145, 250, 0.12);
      }

      .initial-app-loader__bar::after {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #0291fa;
        animation: initial-loader-progress 1.1s ease-in-out infinite;
        content: "";
      }

      @keyframes initial-loader-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(340%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-app-loader__bar::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Repliyo",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "%LANDING_STRUCTURED_DESCRIPTION%",
      "url": "https://repliyo.com",
      "image": "https://repliyo.com/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Start free"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "50"
      },
      "featureList": [
        "Unified social media inbox",
        "AI-powered automatic responses",
        "Integrated CRM",
        "Smart reminders and follow-ups",
        "Sentiment analysis and crisis alerts",
        "Multi-platform support: Instagram, TikTok, Facebook, YouTube, LinkedIn"
      ],
      "inLanguage": ["es", "en"]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="initial-app-loader" role="status" aria-label="Loading Repliyo">
        <div class="initial-app-loader__content" aria-hidden="true">
          <div class="initial-app-loader__mark">R</div>
          <div class="initial-app-loader__bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
